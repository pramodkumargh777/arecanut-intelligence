name: Deploy to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run db:migrate:local
      - run: python -m pip install -r data-platform/requirements-forecasting.txt -r data-platform/requirements-documents.txt
      - run: python -m pytest -q tests/data
      - name: Validate production configuration
        env:
          ANI_API_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const config = readFileSync("api/wrangler.toml", "utf8");
          const id = config.match(/^database_id\s*=\s*"([^"]+)"/m)?.[1];
          if (!id || id === "00000000-0000-0000-0000-000000000000") {
            throw new Error("Set a real production D1 database_id in api/wrangler.toml before deploying.");
          }
          const origins = config.match(/^CORS_ORIGIN\s*=\s*"([^"]+)"/m)?.[1]?.split(",").map(value => value.trim()) ?? [];
          if (!origins.some(origin => origin.startsWith("https://"))) {
            throw new Error("Configure the production frontend HTTPS CORS origin in api/wrangler.toml.");
          }
          if (process.env.ANI_API_URL) {
            const url = new URL(process.env.ANI_API_URL);
            if (url.protocol !== "https:" || !url.pathname.endsWith("/api/v1")) {
              throw new Error("VITE_API_BASE_URL must be an HTTPS Worker URL ending in /api/v1.");
            }
          }
          JS

  deploy-worker:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply ani-market-data --remote --config api/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy --config api/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    needs: deploy-worker
    if: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME != '' && vars.VITE_API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace frontend run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - run: npx wrangler pages deploy frontend/dist --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" --branch="$DEPLOY_BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          DEPLOY_BRANCH: ${{ github.event.repository.default_branch }}
