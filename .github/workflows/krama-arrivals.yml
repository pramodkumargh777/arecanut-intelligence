name: KRAMA daily arrivals

# KRAMA (the Karnataka Department of Agricultural Marketing's market information system) only answers Indian IP addresses:
# GitHub's runners and Cloudflare time out (checked 2026-11-18). So the job runs on the self-hosted runner named by the
# KRAMA_RUNNER repository variable (the "krama-india" runner on an Oracle Always Free VM in Mumbai; docs/DAILY_ARRIVALS.md).
# Scheduled runs are skipped while KRAMA_RUNNER is unset. Each run re-reads the last 7 days, then backfills dates not
# stored yet back to 2014-01-01 within KRAMA_BACKFILL_REQUESTS requests (default 900). It checks KRAMA first and stops at
# once if KRAMA does not answer. Set KRAMA_ARRIVALS_ENABLED to "false" to stop it.
on:
  schedule:
    - cron: "0 16 * * *"  # 21:30 IST, after the day's markets have reported
    - cron: "0 4 * * *"   # 09:30 IST, late uploads for the previous day
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and check only; store nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: krama-arrivals
  cancel-in-progress: false

jobs:
  arrivals:
    if: ${{ vars.ANI_API_URL != '' && vars.KRAMA_ARRIVALS_ENABLED != 'false' && (github.event_name != 'schedule' || vars.KRAMA_RUNNER != '') }}
    runs-on: ${{ vars.KRAMA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check credentials
        id: credentials
        run: |
          if [ -z "$INGESTION_TOKEN" ]; then
            echo "::warning::INGESTION_TOKEN secret is not configured; skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          INGESTION_TOKEN: ${{ secrets.INGESTION_TOKEN }}
      - name: Import Karnataka arecanut daily arrivals (KRAMA)
        if: steps.credentials.outputs.configured == 'true'
        run: |
          args=(--env-file /dev/null --report-dir "$RUNNER_TEMP/krama-arrivals" --recent-days 7 --backfill-from 2014-01-01
                --backfill-requests "${KRAMA_BACKFILL_REQUESTS:-900}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          python data-platform/connectors/krama/run_arrivals.py "${args[@]}"
        env:
          PYTHONUNBUFFERED: "1"
          KRAMA_BASE_URL: ${{ vars.KRAMA_BASE_URL }}
          KRAMA_BACKFILL_REQUESTS: ${{ vars.KRAMA_BACKFILL_REQUESTS }}
          INGESTION_TOKEN: ${{ secrets.INGESTION_TOKEN }}
          ANI_API_URL: ${{ vars.ANI_API_URL }}
      - name: Archive source pages and reports
        if: always() && steps.credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: krama-arrivals-${{ github.run_id }}
          path: ${{ runner.temp }}/krama-arrivals
          if-no-files-found: ignore
          retention-days: 90
