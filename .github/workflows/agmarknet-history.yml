name: AGMARKNET history

# Add-on to agmarknet-ingestion.yml (which is unchanged). data.gov.in refreshes its variety-wise daily history
# overnight (about 05:00 IST), so this runs after that and fills any recent date the current-daily run missed.
# Dates the daily feed already holds are skipped by the API; re-checking a date is idempotent.
# For a one-off backfill, dispatch it manually with a start and end date (one year per run fits the D1 free tier).
on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST
  workflow_dispatch:
    inputs:
      start:
        description: First arrival date (YYYY-MM-DD). Leave empty for the last 14 days.
        type: string
        default: ""
      end:
        description: Last arrival date (YYYY-MM-DD). Capped at two days ago.
        type: string
        default: ""
      dry_run:
        description: Fetch and validate only; persist nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agmarknet-history
  cancel-in-progress: false

jobs:
  history:
    if: ${{ vars.ANI_API_URL != '' && vars.AGMARKNET_PRICE_UNIT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check credentials
        id: credentials
        run: |
          if [ -z "$DATA_GOV_IN_API_KEY" ] || [ -z "$INGESTION_TOKEN" ]; then
            echo "::warning::DATA_GOV_IN_API_KEY or INGESTION_TOKEN secret is not configured; skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          INGESTION_TOKEN: ${{ secrets.INGESTION_TOKEN }}
      - name: Fill Karnataka arecanut history (data.gov.in)
        if: steps.credentials.outputs.configured == 'true'
        run: |
          args=(--env-file /dev/null --report-dir "$RUNNER_TEMP/agmarknet-history")
          if [ -n "$START" ]; then
            args+=(--start "$START")
            if [ -n "$END" ]; then args+=(--end "$END"); fi
          else
            args+=(--recent-days 14)
          fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python data-platform/connectors/agmarknet/run_history.py "${args[@]}"
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          DRY_RUN: ${{ inputs.dry_run }}
          AGMARKNET_HISTORY_RESOURCE_ID: ${{ vars.AGMARKNET_HISTORY_RESOURCE_ID }}
          AGMARKNET_API_BASE_URL: ${{ vars.AGMARKNET_API_BASE_URL }}
          AGMARKNET_PRICE_UNIT: ${{ vars.AGMARKNET_PRICE_UNIT }}
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          INGESTION_TOKEN: ${{ secrets.INGESTION_TOKEN }}
          ANI_API_URL: ${{ vars.ANI_API_URL }}
      - name: Archive source pages and reports for replay
        if: always() && steps.credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agmarknet-history-${{ github.run_id }}
          path: ${{ runner.temp }}/agmarknet-history
          if-no-files-found: ignore
          retention-days: 90
