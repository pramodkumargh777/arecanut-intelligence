name: AGMARKNET history

# Add-on to agmarknet-ingestion.yml (which is unchanged). Fully scheduled; nothing needs starting by hand.
# Each run, after data.gov.in's overnight refresh (about 05:00 IST):
# 1. fills any of the last 14 days the current-daily runs missed (dates the daily feed holds are skipped);
# 2. backfills older history, newest month first, until 2021-01-01 is reached, then does nothing more.
#    Each run stores at most AGMARKNET_HISTORY_DAILY_RECORDS records (default 4,000). Measured cost: 17.4 D1 rows
#    written per record, so 4,000 records is about 70,000 of D1 Free's 100,000 writes per day, leaving the rest for
#    the daily import and cooperative collection. On Workers Paid, set the variable to e.g. 100000 to finish in a day.
on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST
  workflow_dispatch: # optional "run now"; not needed for normal operation

permissions:
  contents: read

concurrency:
  group: agmarknet-history
  cancel-in-progress: false

jobs:
  history:
    if: ${{ vars.ANI_API_URL != '' && vars.AGMARKNET_PRICE_UNIT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check credentials
        id: credentials
        run: |
          if [ -z "$DATA_GOV_IN_API_KEY" ] || [ -z "$INGESTION_TOKEN" ]; then
            echo "::warning::DATA_GOV_IN_API_KEY or INGESTION_TOKEN secret is not configured; skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          INGESTION_TOKEN: ${{ secrets.INGESTION_TOKEN }}
      - name: Fill Karnataka arecanut history (data.gov.in)
        if: steps.credentials.outputs.configured == 'true'
        run: |
          python data-platform/connectors/agmarknet/run_history.py --env-file /dev/null \
            --report-dir "$RUNNER_TEMP/agmarknet-history" --recent-days 14 --backfill-from 2021-01-01 \
            --backfill-months 12 --backfill-max-records "${AGMARKNET_HISTORY_DAILY_RECORDS:-4000}"
        env:
          AGMARKNET_HISTORY_RESOURCE_ID: ${{ vars.AGMARKNET_HISTORY_RESOURCE_ID }}
          AGMARKNET_API_BASE_URL: ${{ vars.AGMARKNET_API_BASE_URL }}
          AGMARKNET_PRICE_UNIT: ${{ vars.AGMARKNET_PRICE_UNIT }}
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          INGESTION_TOKEN: ${{ secrets.INGESTION_TOKEN }}
          ANI_API_URL: ${{ vars.ANI_API_URL }}
          AGMARKNET_HISTORY_DAILY_RECORDS: ${{ vars.AGMARKNET_HISTORY_DAILY_RECORDS }}
      - name: Archive source pages and reports for replay
        if: always() && steps.credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agmarknet-history-${{ github.run_id }}
          path: ${{ runner.temp }}/agmarknet-history
          if-no-files-found: ignore
          retention-days: 90
